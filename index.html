<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach de Vendas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0d1b2e;
    --navy-mid: #152638;
    --navy-3: #1a2f4a;
    --cream: #EEE8DC;
    --cream-dim: #c8c0b4;
    --gold: #C9A96E;
    --gold-dim: #a8865a;
    --teal: #9FE1CB;
    --coral: #F0997B;
    --border: rgba(238,232,220,0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--navy); color: var(--cream); min-height: 100vh; }
  .page { max-width: 760px; margin: 0 auto; padding: 2.25rem 1rem 4rem; }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(201,169,110,0.1); border: 1px solid rgba(201,169,110,0.28);
    border-radius: 20px; padding: 5px 14px; margin-bottom: 14px;
    font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold);
  }
  h1 { font-family: 'DM Serif Display', serif; font-size: clamp(26px, 5vw, 36px); line-height: 1.15; margin-bottom: 6px; font-weight: 400; }
  h1 span { color: var(--gold); }
  .tagline { font-size: 13px; color: var(--cream-dim); font-weight: 300; line-height: 1.6; margin-bottom: 1.5rem; }

  .lbl { display: block; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--cream-dim); margin-bottom: 7px; }

  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
  @media (max-width: 520px) { .seg { grid-template-columns: 1fr; } }
  .seg button {
    padding: 11px 10px; border-radius: 10px; cursor: pointer;
    background: var(--navy-mid); border: 1px solid var(--border); color: var(--cream-dim);
    font-family: inherit; font-size: 13px; font-weight: 500; transition: all 0.15s;
  }
  .seg button:hover { border-color: rgba(201,169,110,0.4); color: var(--cream); }
  .seg button.on { background: rgba(201,169,110,0.14); border-color: rgba(201,169,110,0.55); color: var(--gold); }

  textarea, input[type=text] {
    width: 100%; background: var(--navy-mid); border: 1px solid var(--border);
    border-radius: 10px; color: var(--cream); font-family: inherit; font-size: 14px;
    outline: none; transition: border-color 0.2s; padding: 12px 14px; line-height: 1.6;
  }
  textarea:focus, input[type=text]:focus { border-color: rgba(201,169,110,0.5); }
  textarea::placeholder, input::placeholder { color: rgba(238,232,220,0.3); }
  #conversa { min-height: 170px; resize: vertical; }

  details { margin: 10px 0 14px; }
  summary { cursor: pointer; font-size: 12px; color: var(--cream-dim); padding: 4px 0; user-select: none; }
  summary:hover { color: var(--cream); }
  details input { margin-top: 8px; }

  .btn {
    width: 100%; padding: 14px; background: var(--gold); color: var(--navy);
    border: none; border-radius: 10px; font-family: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background 0.2s;
  }
  .btn:hover { background: var(--gold-dim); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .hint { text-align: center; font-size: 11px; color: rgba(238,232,220,0.3); margin-top: 8px; }

  .err { display: none; background: rgba(163,45,45,0.15); border: 1px solid rgba(163,45,45,0.35); border-radius: 10px; padding: 12px 14px; font-size: 13px; color: #F7C1C1; margin-top: 12px; }
  .err.on { display: block; }

  #results { display: none; margin-top: 1.75rem; }
  #results.on { display: block; animation: fadeUp 0.35s ease both; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; }
  .chip.etapa { background: rgba(159,225,203,0.1); color: var(--teal); border: 1px solid rgba(159,225,203,0.25); }
  .chip.obj { background: rgba(240,153,123,0.1); color: var(--coral); border: 1px solid rgba(240,153,123,0.28); }

  .leitura { font-size: 13px; line-height: 1.65; color: var(--cream-dim); font-weight: 300; margin-bottom: 16px; }
  .leitura b { color: var(--cream); font-weight: 600; }

  .resp {
    background: var(--navy-mid); border: 1px solid var(--border);
    border-left: 3px solid var(--gold); border-radius: 0 12px 12px 0;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .resp .ang { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
  .resp .txt { font-size: 14px; line-height: 1.7; white-space: pre-wrap; font-weight: 300; }
  .copy {
    margin-top: 10px; padding: 6px 14px; border-radius: 7px; cursor: pointer;
    background: transparent; border: 1px solid rgba(201,169,110,0.4); color: var(--gold);
    font-family: inherit; font-size: 12px; font-weight: 500; transition: background 0.15s;
  }
  .copy:hover { background: rgba(201,169,110,0.12); }
  .copy.ok { border-color: rgba(159,225,203,0.5); color: var(--teal); }

  .prox { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: rgba(159,225,203,0.06); border: 1px solid rgba(159,225,203,0.2); font-size: 13px; line-height: 1.6; }
  .prox .l { display: block; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--teal); margin-bottom: 4px; }

  .outras { margin-top: 14px; width: 100%; padding: 11px; border-radius: 10px; cursor: pointer; background: transparent; border: 1px solid var(--border); color: var(--cream-dim); font-family: inherit; font-size: 13px; transition: all 0.15s; }
  .outras:hover { border-color: rgba(201,169,110,0.4); color: var(--cream); }
  .outras:disabled { opacity: 0.5; cursor: not-allowed; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="page">

  <div class="badge">Coach de Vendas</div>
  <h1>Cole a resposta.<br><span>Receba o que mandar.</span></h1>
  <p class="tagline">Escolha a oferta, cole o que o lead respondeu e copie a mensagem pronta. O resto, o coach já sabe.</p>

  <label class="lbl">Oferta</label>
  <div class="seg" id="seg">
    <button type="button" data-oferta="delivery">Delivery e restaurantes</button>
    <button type="button" data-oferta="bcore">Clínicas (BCore)</button>
    <button type="button" data-oferta="autonomos">Sites para autônomos</button>
  </div>

  <label class="lbl" for="conversa">Conversa ou última resposta do lead</label>
  <textarea id="conversa" placeholder="Cole aqui o texto da conversa do WhatsApp (não precisa ser print).&#10;&#10;Pode ser só a resposta do lead, por exemplo:&#10;Oi, Caio! Tudo certo por aqui. Vou dar uma olhada nisso, só um momento."></textarea>

  <details id="det">
    <summary>Contexto do lead (opcional)</summary>
    <input type="text" id="contexto" placeholder="Ex: Brutus Hamburgueria, 70 avaliações, só iFood, enviei o pitch completo">
  </details>

  <button class="btn" id="btn" type="button">Gerar resposta</button>
  <div class="hint">Ctrl + Enter também gera</div>

  <div class="err" id="err"></div>

  <div id="results">
    <div class="chips" id="chips"></div>
    <div class="leitura" id="leitura"></div>
    <div id="respostas"></div>
    <div class="prox" id="prox"></div>
    <button class="outras" id="outras" type="button">Gerar outras opções</button>
  </div>

</div>

<script>
  var ETAPAS = {
    primeiro_retorno: 'Primeiro retorno',
    objecao: 'Objeção',
    followup: 'Follow-up',
    quase_fechando: 'Quase fechando',
    reativar: 'Reativar'
  };

  var oferta = 'delivery';
  var tentativa = 1;
  var ultimaEntrada = '';

  function $(id) { return document.getElementById(id); }

  function lerLS(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function gravarLS(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  // Remove travessão por garantia (o servidor também limpa).
  function limpo(t) { return String(t == null ? '' : t).replace(/\s*[\u2014\u2013]\s*/g, ', ').trim(); }

  function marcarOferta(o) {
    oferta = o;
    var botoes = document.querySelectorAll('#seg button');
    for (var i = 0; i < botoes.length; i++) {
      botoes[i].classList.toggle('on', botoes[i].getAttribute('data-oferta') === o);
    }
    gravarLS('coach_oferta', o);
  }

  function mostrarErro(msg) {
    var el = $('err');
    el.textContent = msg;
    el.classList.add('on');
  }

  function carregando(on) {
    $('btn').disabled = on;
    $('outras').disabled = on;
    $('btn').textContent = on ? 'Gerando...' : 'Gerar resposta';
  }

  async function gerar(novaTentativa) {
    var conversa = $('conversa').value.trim();
    if (!conversa) { $('conversa').focus(); return; }
    var contexto = $('contexto').value.trim();

    // Mesma entrada = pedido de outras opções; entrada nova = recomeça.
    var entrada = oferta + '|' + conversa + '|' + contexto;
    if (novaTentativa && entrada === ultimaEntrada) tentativa += 1;
    else tentativa = 1;
    ultimaEntrada = entrada;

    $('err').classList.remove('on');
    carregando(true);
    try {
      var res = await fetch('/api/claude', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ oferta: oferta, conversa: conversa, contexto: contexto, tentativa: tentativa })
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok || !data.ok) {
        var m = (data.error && data.error.message) || ('Erro ' + res.status);
        throw new Error(m);
      }
      render(data.resultado);
    } catch (e) {
      mostrarErro(e.message || 'Algo deu errado. Tente de novo.');
    } finally {
      carregando(false);
    }
  }

  function render(r) {
    var chips = $('chips');
    chips.textContent = '';
    var obj = limpo(r.objecao);
    var temObj = !!obj && obj.toLowerCase() !== 'nenhuma';
    var etapa = ETAPAS[r.etapa] || limpo(r.etapa);
    // Quando a etapa é "objecao" o chip da objeção já diz isso: não repete.
    if (etapa && !(temObj && r.etapa === 'objecao')) {
      var c1 = document.createElement('span');
      c1.className = 'chip etapa';
      c1.textContent = etapa;
      chips.appendChild(c1);
    }
    if (temObj) {
      var c2 = document.createElement('span');
      c2.className = 'chip obj';
      c2.textContent = 'Objeção: ' + obj;
      chips.appendChild(c2);
    }

    var leit = $('leitura');
    leit.textContent = '';
    if (r.leitura) {
      var b = document.createElement('b');
      b.textContent = 'Leitura: ';
      leit.appendChild(b);
      leit.appendChild(document.createTextNode(limpo(r.leitura)));
    }

    var box = $('respostas');
    box.textContent = '';
    (r.respostas || []).forEach(function (item) {
      var card = document.createElement('div');
      card.className = 'resp';

      var ang = document.createElement('div');
      ang.className = 'ang';
      ang.textContent = limpo(item.angulo) || 'Resposta';

      var txt = document.createElement('div');
      txt.className = 'txt';
      txt.textContent = limpo(item.texto);

      var cp = document.createElement('button');
      cp.type = 'button';
      cp.className = 'copy';
      cp.textContent = 'Copiar mensagem';
      cp.addEventListener('click', function () { copiar(txt.textContent, cp); });

      card.appendChild(ang);
      card.appendChild(txt);
      card.appendChild(cp);
      box.appendChild(card);
    });

    var prox = $('prox');
    prox.textContent = '';
    if (r.proximo_passo) {
      var l = document.createElement('span');
      l.className = 'l';
      l.textContent = 'Próximo passo agora';
      prox.appendChild(l);
      prox.appendChild(document.createTextNode(limpo(r.proximo_passo)));
      prox.style.display = '';
    } else {
      prox.style.display = 'none';
    }

    $('results').classList.add('on');
    $('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function copiar(texto, btn) {
    function feito() {
      btn.textContent = 'Copiado';
      btn.classList.add('ok');
      setTimeout(function () { btn.textContent = 'Copiar mensagem'; btn.classList.remove('ok'); }, 1800);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(feito, function () { btn.textContent = 'Selecione e copie'; });
    } else {
      btn.textContent = 'Selecione e copie';
    }
  }

  // ─── eventos ────────────────────────────────────────────────
  document.querySelectorAll('#seg button').forEach(function (b) {
    b.addEventListener('click', function () { marcarOferta(b.getAttribute('data-oferta')); });
  });
  $('btn').addEventListener('click', function () { gerar(false); });
  $('outras').addEventListener('click', function () { gerar(true); });
  $('conversa').addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); gerar(false); }
  });

  // ─── início: lembra a última oferta e aceita dados vindos de link ───
  // Exemplo de link (para o Leads Finder abrir já preenchido):
  //   ?oferta=delivery&ctx=Brutus%20Hamburgueria%2C%2070%20avalia%C3%A7%C3%B5es%2C%20s%C3%B3%20iFood
  (function iniciar() {
    var validas = ['delivery', 'bcore', 'autonomos'];
    var p = new URLSearchParams(location.search);
    var o = p.get('oferta') || lerLS('coach_oferta') || 'delivery';
    marcarOferta(validas.indexOf(o) >= 0 ? o : 'delivery');

    var ctx = p.get('ctx');
    if (ctx) {
      $('contexto').value = ctx.slice(0, 800);
      $('det').open = true;
    }
    var conv = p.get('conversa');
    if (conv) $('conversa').value = conv.slice(0, 8000);
  })();
</script>
</body>
</html>
